[project]
name = "mergen-platform"
version = "0.1.0"
description = "Scalable AI Monorepo Infrastructure for Mergen Platform"
readme = "readme.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx2>=0.28.0",
    "sqlalchemy>=2.0.51",
    "psycopg2-binary>=2.9.12",
    "alembic>=1.16.5",
    "asyncpg>=0.31.0",
    "pyjwt[crypto]>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.9",
    "apscheduler>=3.10.0",
]

[tool.uv]
managed = true
dev-dependencies = [
    "pytest>=8.4.2",
]
